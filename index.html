<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teaching Tracker</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#1b2733;--mute:#5b6b78;--line:#d9e1e7;--pri:#1e5f74;--onpri:#fff;--acc:#e39b1b;--ok:#2e8b57;--okbg:#e3f3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--card:#18232b;--ink:#e8eef2;--mute:#9bacb8;--line:#2a3944;--pri:#5fb3cc;--onpri:#08222b;--acc:#f0b04a;--ok:#5fcf8f;--okbg:#17352a}}
:root[data-theme="dark"]{--bg:#10181e;--card:#18232b;--ink:#e8eef2;--mute:#9bacb8;--line:#2a3944;--pri:#5fb3cc;--onpri:#08222b;--acc:#f0b04a;--ok:#5fcf8f;--okbg:#17352a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin-inline:auto;padding:12px 12px 84px}
h1{font-size:1.25rem;margin:4px 0 10px}h2{font-size:1rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;max-width:100%}
textarea{width:100%;min-height:150px}input[type=text],input[type=date],select{width:100%}
button{cursor:pointer}button.p{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
button.s{padding:6px 10px;font-size:.9rem}button.g{border:0;background:none;color:var(--mute);padding:6px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok)}
.mute{color:var(--mute);font-size:.88rem}.big{font-size:1.6rem;font-weight:700}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;padding:0;display:grid;place-items:center;font-size:.9rem}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.unit{font-weight:700;color:var(--pri);margin:14px 0 2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:640px}nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mute)}nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:7px}.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.late{color:var(--acc);font-weight:700}.now{color:var(--pri);font-weight:700}details{margin:4px 0 2px}details div{white-space:pre-line;margin-top:4px}summary{cursor:pointer}
</style></head><body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script>
const KEY='teachtrack.v1';
const MN=['','January','February','March','April','May','June','July','August','September','October','November','December'];
const PLAN=[
['Term 1 · Ch. 1: Fundamentals','Week 1–2',3,3,['RAM and ROM','Storage units','IPO model','Dzongkha Unicode setup'],'Hands-on demo: identify hardware/software','Explain IPO model, differentiate hardware/software, interpret storage units','Oral Q&A, worksheet'],
['Term 1 · Ch. 2: Number System','Week 3',3,3,['Place values','Binary ON/OFF demo'],'Binary card activity','Represent data in binary, understand digitised forms','Practical demo'],
['Term 1 · Ch. 3: Networks','Week 4–5',4,4,['PAN, LAN, WAN, Internet','Wired vs. wireless','SIM cards'],'Network diagram drawing, Wi-Fi demo','Differentiate types of networks, explain addressing systems','Diagram + oral explanation'],
['Term 1 · Ch. 4: MS Word','Week 6–7',4,4,['Formatting','Alignment','Shortcuts'],'Create bilingual formatted document','Create and edit documents in English/Dzongkha','Document rubric'],
['Term 1 · Ch. 5: PowerPoint','Week 8–9',5,5,['Slides','Text and images','Layouts'],'Build Dzongkha-English presentation','Design multimedia content integrating text/images','Presentation rubric'],
['Term 1 · Ch. 6: Spreadsheets','Week 10–12',6,6,['Categorical, discrete, continuous data','Survey and observation methods'],'Collect class data','Organize and represent data using spreadsheets','Spreadsheet submission'],
['Term 1 · Ch. 6 (continued): Data Visualization','Week 13–14',7,7,['Charts','Filters','Chart dynamics'],'Create bar/pie charts','Analyse charts to solve problems','Chart assignment'],
['Term 1 · Project: Word + PowerPoint + Spreadsheet charts','Week 15–16',7,7,['Project work','Term 1 evaluation'],'Term 1 evaluation','Integrate productivity tools for communication and data handling','Project rubric'],
['Term 2 · Ch. 7: AI','Week 1',8,8,['Intro concepts','Ethical reflection'],'Class discussion on AI in Bhutan','Reflect on ethical use of AI','Reflection journal'],
['Term 2 · Ch. 8: Robots','Week 2–3',8,9,['Sensor, controller, motor','Micro:bit basics'],'Micro:bit demo','Explore control systems in robotics','Practical demo checklist'],
['Term 2 · Ch. 9: Cyberbullying & Digital Safety','Week 4',9,9,['Passwords','Personal info protection'],'Role-play scenarios','Identify cyberbullying, safe online practices','Scenario-based quiz'],
['Term 2 · Ch. 10: Algorithms','Week 5–6',9,9,['Sequencing','Variables','Debugging'],'Debugging exercises','Debug programs with variables','Debugging task'],
['Term 2 · Ch. 11: CodeMonkey','Week 7–10',9,10,['Objects','Methods','Dot operator','Arrays'],'Coding challenges','Apply objects, methods, arrays','Coding rubric'],
['Term 2 · Ch. 12: Scratch','Week 11–14',10,11,['Sprites','Motion and sound blocks','Paint editor'],'Build interactive Scratch project','Create interactive multimedia project','Scratch rubric'],
['Term 2 · Project: Spreadsheet chart + Scratch game','Week 15–16',11,11,['Project work','Term 2 evaluation'],'Term 2 evaluation','Integrate data handling + programming','Project rubric']];
function mkSub(){const r=()=>Math.random().toString(36).slice(2,9),s={id:r(),name:'Class 4 DTI – Year Plan 2026',year:2026,info:{},topics:[]};PLAN.forEach(p=>{s.info[p[0]]='Key activity: '+p[5]+'\nObjectives: '+p[6]+'\nAssessment: '+p[7];p[4].forEach(t=>s.topics.push({id:r(),unit:p[0],title:t,taught:null,wk:p[1],f:p[2],m:p[3]}))});return s}
function mkState(){const s=mkSub();return{subjects:[s],active:s.id}}
function when(x){return x.wk?x.wk+' · '+(x.f===x.m?MN[x.f]:MN[x.f]+'–'+MN[x.m]):''}
function tag(s,x){if(x.taught||!x.m)return'';const d=new Date(),c=(d.getFullYear()-(s.year||d.getFullYear()))*12+d.getMonth()+1;return x.m<c?'Behind schedule':(x.f<=c?'Due this month':'')}
let S=load(),tab='today',flt='all',mode='';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mkState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toLocaleDateString('en-CA');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sub=()=>S.subjects.find(s=>s.id===S.active)||S.subjects[0];
function parse(text,units){let u='';const out=[];text.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){u=l.replace(/^#+\s*/,'');return}out.push({id:uid(),unit:u,title:l,taught:null})});return out}
function fmt(d){try{return new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function stats(s){const t=s.topics.length,d=s.topics.filter(x=>x.taught).length;return{t,d,left:t-d,pct:t?Math.round(d/t*100):0}}
function head(s){const st=stats(s);return`<div class="card"><div class="row"><div class="grow"><select id="sel" aria-label="Class and subject">${S.subjects.map(x=>`<option value="${x.id}"${x.id===s.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div><button class="s" data-a="new">+ New</button></div>
<div class="bar"><i style="width:${st.pct}%"></i></div><div class="mute"><b>${st.d}</b> taught · <b>${st.left}</b> not yet taught · ${st.pct}% covered${(l=>l?` · <span class="late">${l} behind schedule</span>`:'')(s.topics.filter(x=>tag(s,x)==='Behind schedule').length)}</div></div>`}
function empty(){return`<h1>Teaching Tracker</h1><div class="card"><p>Add your first class or subject, then paste its topics (one per line). Start a line with # to make a unit heading.</p><div class="row"><button class="p grow" data-a="new">Add class / subject</button><button class="grow" data-a="plan">Load Class 4 DTI Year Plan</button></div></div>`}
function newForm(){return`<h1>New class / subject</h1><div class="card"><label class="mute">Name</label><input type="text" id="nm" placeholder="Class IV – DTI"><p class="mute"><b>Upload your annual plan</b> (Excel, CSV, Word .docx or text). It fills the box below so you can check and fix it before saving.</p><input type="file" id="pf" data-t="tp" accept=".xlsx,.xls,.csv,.docx,.txt,.md"><p class="mute">Or paste topics, one per line. Lines starting with # are unit headings. PDF or photo? Ask Claude in chat to convert it to a text list first.</p><textarea id="tp" placeholder="# Unit 1: Computer basics&#10;Parts of a computer&#10;Using the mouse&#10;# Unit 2: Typing&#10;Home row keys"></textarea><div class="row" style="margin-top:8px"><button class="p grow" data-a="savesub">Save</button>${S.subjects.length?'<button data-a="cancel">Cancel</button>':''}</div></div>`}
function today_(s){const t=today(),done=s.topics.filter(x=>x.taught&&x.taught.date===t),next=s.topics.filter(x=>!x.taught).slice(0,5);
return`${head(s)}<div class="card"><div class="mute">${fmt(t)}</div><div class="row" style="margin-top:6px"><div class="grow"><label class="mute">Date taught</label><input type="date" id="dt" value="${t}"></div></div><label class="mute">Note (optional)</label><input type="text" id="nt" placeholder="e.g. class did practical, repeat next week"></div>
<h2>Up next</h2><div class="card">${next.length?next.map(x=>`<div class="item"><button class="chk" data-a="tg" data-id="${x.id}" aria-label="Mark taught"></button><div class="grow">${esc(x.title)}<div class="mute">${esc(x.unit)} · ${when(x)} ${tag(s,x)?`<span class="${tag(s,x)[0]==='B'?'late':'now'}">${tag(s,x)}</span>`:''}</div></div></div>`).join(''):'<div class="mute">Everything is covered. 🎉</div>'}</div>
<h2>Taught today</h2><div class="card">${done.length?done.map(x=>`<div class="item"><button class="chk on" data-a="un" data-id="${x.id}" aria-label="Undo">✓</button><div class="grow">${esc(x.title)}<div class="mute">${esc(x.taught.note)}</div></div></div>`).join(''):'<div class="mute">Nothing logged yet today.</div>'}</div>`}
function topics_(s){const list=s.topics.filter(x=>flt==='all'||(flt==='done')===!!x.taught);let u=null,h='';
list.forEach(x=>{if(x.unit!==u){u=x.unit;if(u)h+=`<div class="unit">${esc(u)}</div><div class="row"><details class="grow mute"><summary>Plan details</summary><div>${esc((s.info||{})[u]||'')}</div></details><button class="s" data-a="unit" data-u="${encodeURIComponent(u)}">Mark chapter taught</button></div>`}
h+=`<div class="item"><button class="chk${x.taught?' on':''}" data-a="${x.taught?'un':'tg'}" data-id="${x.id}" aria-label="Toggle taught">${x.taught?'✓':''}</button><div class="grow">${esc(x.title)}<div class="mute">${x.taught?fmt(x.taught.date)+(x.taught.note?' · '+esc(x.taught.note):''):'Not yet taught · '+when(x)+' '+(tag(s,x)?`<span class="${tag(s,x)[0]==='B'?'late':'now'}">${tag(s,x)}</span>`:'')}</div></div><button class="g" data-a="del" data-id="${x.id}" aria-label="Delete topic">✕</button></div>`});
return`${head(s)}<div class="tabs">${[['all','All'],['todo','Not yet'],['done','Taught']].map(f=>`<button class="${flt===f[0]?'on':''}" data-a="flt" data-f="${f[0]}">${f[1]}</button>`).join('')}</div><div class="card">${h||'<div class="mute">No topics here.</div>'}</div>
<h2>Add topics</h2><div class="card"><input type="file" id="pf" data-t="more" accept=".xlsx,.xls,.csv,.docx,.txt,.md" style="margin-bottom:8px"><textarea id="more" style="min-height:90px" placeholder="One topic per line (# for a new unit)"></textarea><button class="p" style="margin-top:8px" data-a="add">Add topics</button></div>
<h2>Delete</h2><div class="card"><p class="mute">Remove this whole plan and all its records. This cannot be undone, so download a backup first if unsure.</p><button data-a="delsub">Delete “${esc(s.name)}”</button></div>`}
function log_(s){const l=s.topics.filter(x=>x.taught).sort((a,b)=>b.taught.date.localeCompare(a.taught.date));
return`${head(s)}<div class="card">${l.length?l.map(x=>`<div class="item"><div class="grow"><div class="mute">${fmt(x.taught.date)}</div>${esc(x.title)}<div class="mute">${esc(x.taught.note)}</div></div><button class="g" data-a="note" data-id="${x.id}">Edit note</button></div>`).join(''):'<div class="mute">Nothing taught yet. Mark topics on the Today tab.</div>'}</div>`}
function more_(){const s=sub();return`<h1>Backup</h1><div class="card"><button data-a="plan">Add Class 4 DTI Year Plan 2026</button></div><div class="card"><p class="mute">Your records are saved in this browser on this device. Download a backup regularly, and use it to move to a new phone or computer.</p><div class="row"><button class="p grow" data-a="exp">Download backup</button><button class="grow" data-a="imp">Restore backup</button></div><input type="file" id="file" accept="application/json" hidden></div>${s?`<div class="card"><button data-a="delsub">Delete “${esc(s.name)}”</button></div>`:''}`}
function render(){const s=sub();let h;
if(mode==='new')h=newForm();else if(tab==='more')h=more_();else if(!s)h=empty();else h={today:today_,topics:topics_,log:log_}[tab](s);
$('#app').innerHTML=h;
$('#nav').innerHTML=[['today','Today'],['topics','Topics'],['log','Log'],['more','Backup']].map(t=>`<button class="${tab===t[0]&&mode!=='new'?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
const sel=$('#sel');if(sel)sel.onchange=()=>{S.active=sel.value;save();render()}}
function find(id){return sub().topics.find(x=>x.id===id)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='tab'){tab=b.dataset.t;mode='';}
else if(a==='new')mode='new';
else if(a==='cancel')mode='';
else if(a==='savesub'){const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}const s={id:uid(),name:n,topics:parse($('#tp').value)};S.subjects.push(s);S.active=s.id;mode='';tab='today';save()}
else if(a==='tg'){const t=find(id);t.taught={date:($('#dt')&&$('#dt').value)||today(),note:($('#nt')&&$('#nt').value.trim())||''};save()}
else if(a==='unit'){const u=decodeURIComponent(b.dataset.u);let d=prompt('Date taught for this chapter (YYYY-MM-DD)',today());if(d===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=today();sub().topics.forEach(x=>{if(x.unit===u&&!x.taught)x.taught={date:d,note:''}});save()}
else if(a==='plan'){const s=mkSub();S.subjects.push(s);S.active=s.id;tab='today';save()}
else if(a==='un'){find(id).taught=null;save()}
else if(a==='flt')flt=b.dataset.f;
else if(a==='del'){if(confirm('Delete this topic?')){const s=sub();s.topics=s.topics.filter(x=>x.id!==id);save()}}
else if(a==='add'){const t=parse($('#more').value);if(t.length){sub().topics.push(...t);save()}}
else if(a==='note'){const t=find(id),n=prompt('Note',t.taught.note||'');if(n!==null){t.taught.note=n.trim();save()}}
else if(a==='delsub'){if(confirm('Delete "'+sub().name+'" and all its records? This cannot be undone.')){S.subjects=S.subjects.filter(x=>x.id!==sub().id);S.active=null;save();tab='today'}}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='teaching-tracker-'+today()+'.json';l.click();return}
else if(a==='imp'){const f=$('#file');f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&Array.isArray(d.subjects)){S=d;save();tab='today';render()}else alert('Not a valid backup file.')}catch(x){alert('Not a valid backup file.')}};r.readAsText(f.files[0])};f.click();return}
render()});
function rows2txt(r){if(!r.length)return'';const h=Array.from(r[0],x=>String(x??'')),U=h.findIndex(x=>/unit|chapter|term|month|week|strand|theme/i.test(x)),T=h.findIndex(x=>/topic|lesson|content|title|competenc|objective/i.test(x));
if(U>-1&&T>-1&&U!==T){let u='',o=[];r.slice(1).forEach(x=>{const a=String(x[U]??'').trim(),t=String(x[T]??'').trim();if(a&&a!==u){u=a;o.push('# '+a)}if(t)o.push(t)});return o.join('\n')}
return r.map(x=>Array.from(x,c=>String(c??'').trim()).filter(Boolean).join(' – ')).filter(Boolean).join('\n')}
document.addEventListener('change',async e=>{const f=e.target;if(f.id!=='pf')return;const file=f.files[0];if(!file)return;const ta=$('#'+f.dataset.t),n=file.name.toLowerCase();
try{let txt='';
if(/\.(xlsx|xls|csv)$/.test(n)){if(typeof XLSX==='undefined')throw 0;const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});txt=rows2txt(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false}))}
else if(/\.docx$/.test(n)){if(typeof mammoth==='undefined')throw 0;txt=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n')}
else if(/\.(txt|md)$/.test(n))txt=await file.text();
else{alert('Please use an Excel, CSV, Word (.docx) or text file. For a PDF or photo, ask Claude in chat to convert it.');return}
if(!txt.trim()){alert('No topics found in this file.');return}
ta.value=(ta.value?ta.value+'\n':'')+txt;ta.scrollIntoView({block:'center'})}catch(x){alert('Could not read this file. Try pasting the topics instead.')}});
render();
</script></body></html>
